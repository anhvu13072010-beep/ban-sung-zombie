<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Trò chơi Rắn Săn Mồi Sinh Động</title>
    <style>
        body {
            margin: 0;
            background: radial-gradient(circle, #1a1a2e 0%, #0f0f1a 100%);
            color: #fff;
            font-family: 'Segoe UI', Roboto, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between; /* Đẩy các phần tử giãn đều ra */
            height: 100vh; /* Cố định chiều cao toàn màn hình */
            padding: 10px 0 20px 0;
            box-sizing: border-box;
            overflow: hidden;
            touch-action: manipulation;
        }
        h1 {
            margin: 0;
            font-size: 26px;
            font-weight: 800;
            letter-spacing: 1px;
            color: #00f2fe;
            text-shadow: 0 0 10px rgba(0, 242, 254, 0.5);
        }
        .header-container {
            display: flex;
            align-items: center;
            gap: 20px;
            background: rgba(255, 255, 255, 0.05);
            padding: 6px 15px;
            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        #score {
            font-size: 18px;
            color: #00f2fe;
            font-weight: bold;
        }
        #btn-pause {
            background: linear-gradient(135deg, #ff007f 0%, #ff0055 100%);
            color: white;
            border: none;
            padding: 6px 14px;
            font-size: 12px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
        }
        canvas {
            background: #09090e;
            border: 3px solid #00f2fe;
            border-radius: 15px;
            box-shadow: 0 0 20px rgba(0, 242, 254, 0.2);
            max-width: 90vw;
            max-height: 40vh;
        }
        /* Đẩy cụm điều khiển xuống dưới cùng */
        .controls-container {
            margin-top: auto; /* Tự động đẩy xuống sát đáy */
            margin-bottom: 10px;
            display: grid;
            grid-template-columns: repeat(3, 75px);
            grid-template-rows: repeat(3, 75px);
            gap: 12px;
            justify-content: center;
        }
        .btn {
            background: rgba(255, 255, 255, 0.05);
            color: #00f2fe;
            border: 2px solid rgba(0, 242, 254, 0.3);
            border-radius: 50%; /* Làm nút tròn hẳn cho giống tay cầm chơi game */
            font-size: 28px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            user-select: none;
            -webkit-user-select: none;
            transition: all 0.1s ease;
        }
        .btn:active {
            background: rgba(0, 242, 254, 0.3);
            color: #fff;
            border-color: #00f2fe;
            transform: scale(0.9);
        }
        #btn-up { grid-column: 2; grid-row: 1; }
        #btn-left { grid-column: 1; grid-row: 2; }
        #btn-right { grid-column: 3; grid-row: 2; }
        #btn-down { grid-column: 2; grid-row: 3; }
    </style>
</head>
<body>

    <h1>RẮN CON DỄ THƯƠNG</h1>
    
    <div class="header-container">
        <div id="score">ĐIỂM: 0</div>
        <button id="btn-pause">TẠM DỪNG</button>
    </div>

    <canvas id="gameCanvas" width="400" height="400"></canvas>

    <!-- Cụm nút di chuyển nằm ở dưới cùng màn hình -->
    <div class="controls-container">
        <button class="btn" id="btn-up">↑</button>
        <button class="btn" id="btn-left">←</button>
        <button class="btn" id="btn-right">→</button>
        <button class="btn" id="btn-down">↓</button>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const scoreElement = document.getElementById("score");
        const pauseButton = document.getElementById("btn-pause");

        const gridSize = 20;
        const tileCount = canvas.width / gridSize;

        let snake = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }];
        let food = { x: 5, y: 5 };
        let obstacles = [];
        let dx = 1; 
        let dy = 0; 
        let score = 0;
        let gameInterval;
        let gameSpeed = 160; 
        let isPaused = false;

        function main() {
            if (isPaused) return;
            clearCanvas();
            drawObstacles();
            drawFood();
            moveSnake();
            drawSnake();
        }

        resetGame();

        function clearCanvas() {
            ctx.fillStyle = "#09090e";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        function drawSnake() {
            snake.forEach((part, index) => {
                ctx.save();
                
                // Tính toán tọa độ tâm của đốt rắn (để vẽ hình tròn)
                let centerX = part.x * gridSize + gridSize / 2;
                let centerY = part.y * gridSize + gridSize / 2;

                if (index === 0) {
                    // --- VẼ ĐẦU RẮN ---
                    ctx.fillStyle = "#00f2fe";
                    ctx.shadowBlur = 10;
                    ctx.shadowColor = "#00f2fe";
                    
                    ctx.beginPath();
                    ctx.arc(centerX, centerY, gridSize / 2, 0, 2 * Math.PI);
                    ctx.fill();

                    // Vẽ 2 mắt nhỏ màu đen trắng cho sinh động
                    ctx.shadowBlur = 0; // Tắt phát sáng riêng cho mắt
                    
                    // Mắt trái
                    ctx.fillStyle = "#fff";
                    ctx.beginPath();
                    ctx.arc(centerX - 4 * dy + 3 * dx, centerY - 4 * dx + 3 * dy, 3, 0, 2 * Math.PI);
                    ctx.fill();
                    ctx.fillStyle = "#000";
                    ctx.beginPath();
                    ctx.arc(centerX - 4 * dy + 3 * dx, centerY - 4 * dx + 3 * dy, 1.5, 0, 2 * Math.PI);
                    ctx.fill();

                    // Mắt phải
                    ctx.fillStyle = "#fff";
                    ctx.beginPath();
                    ctx.arc(centerX + 4 * dy + 3 * dx, centerY + 4 * dx + 3 * dy, 3, 0, 2 * Math.PI);
                    ctx.fill();
                    ctx.fillStyle = "#000";
                    ctx.beginPath();
                    ctx.arc(centerX + 4 * dy + 3 * dx, centerY + 4 * dx + 3 * dy, 1.5, 0, 2 * Math.PI);
                    ctx.fill();

                } else {
                    // --- VẼ THÂN RẮN ---
                    // Giảm dần kích thước về phía đuôi
                    let radius = (gridSize / 2) * (1 - (index / snake.length) * 0.4);
                    let alpha = 1 - (index / snake.length) * 0.5;
                    
                    ctx.fillStyle = `rgba(4, 217, 255, ${alpha})`;
                    ctx.beginPath();
                    ctx.arc(centerX, centerY, radius, 0, 2 * Math.PI);
                    ctx.fill();
                }
                ctx.restore();
            });
        }

        function drawObstacles() {
            obstacles.forEach(obs => {
                ctx.save();
                ctx.fillStyle = "#ffaa00";
                ctx.shadowBlur = 8;
                ctx.shadowColor = "#ffaa00";
                ctx.beginPath();
                ctx.roundRect(obs.x * gridSize + 2, obs.y * gridSize + 2, gridSize - 4, gridSize - 4, 4);
                ctx.fill();
                ctx.restore();
            });
        }

        function drawFood() {
            ctx.save();
            ctx.fillStyle = "#ff007f";
            ctx.shadowBlur = 15;
            ctx.shadowColor = "#ff007f";
            ctx.beginPath();
            let centerX = food.x * gridSize + gridSize / 2;
            let centerY = food.y * gridSize + gridSize / 2;
            ctx.arc(centerX, centerY, (gridSize - 4) / 2, 0, 2 * Math.PI);
            ctx.fill();
            ctx.restore();
        }

        function moveSnake() {
            let newX = snake[0].x + dx;
            let newY = snake[0].y + dy;

            if (newX < 0) newX = tileCount - 1;
            if (newX >= tileCount) newX = 0;
            if (newY < 0) newY = tileCount - 1;
            if (newY >= tileCount) newY = 0;

            const head = { x: newX, y: newY };
            snake.unshift(head);

            let hitObstacle = false;
            obstacles.forEach(obs => {
                if (head.x === obs.x && head.y === obs.y) hitObstacle = true;
            });

            if (hitObstacle) {
                score = Math.max(0, score - 20); 
                scoreElement.innerText = "ĐIỂM: " + score;
                
                let partsToRemove = 3;
                while(partsToRemove > 0 && snake.length > 2) {
                    snake.pop();
                    partsToRemove--;
                }
                generateObstacles();
                return;
            }

            if (snake[0].x === food.x && snake[0].y === food.y) {
                score += 10;
                scoreElement.innerText = "ĐIỂM: " + score;
                generateFood();
                generateObstacles();
            } else {
                snake.pop();
            }
        }

        function generateFood() {
            food.x = Math.floor(Math.random() * tileCount);
            food.y = Math.floor(Math.random() * tileCount);
            snake.forEach(part => {
                if (part.x === food.x && part.y === food.y) generateFood();
            });
        }

        function generateObstacles() {
            obstacles = [];
            const numberOfObstacles = 4;
            while(obstacles.length < numberOfObstacles) {
                let obsX = Math.floor(Math.random() * tileCount);
                let obsY = Math.floor(Math.random() * tileCount);
                let isValid = true;
                if (obsX === food.x && obsY === food.y) isValid = false;
                snake.forEach(part => {
                    if (part.x === obsX && part.y === obsY) isValid = false;
                });
                if (Math.abs(obsX - snake[0].x) < 2 && Math.abs(obsY - snake[0].y) < 2) isValid = false;
                if (isValid) obstacles.push({ x: obsX, y: obsY });
            }
        }

        function resetGame() {
            snake = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }];
            food = { x: 5, y: 5 };
            dx = 1;
            dy = 0;
            score = 0;
            isPaused = false;
            pauseButton.innerText = "TẠM DỪNG";
            pauseButton.style.background = "linear-gradient(135deg, #ff007f 0%, #ff0055 100%)";
            scoreElement.innerText = "ĐIỂM: " + score;
            generateObstacles();
            clearInterval(gameInterval);
            gameInterval = setInterval(main, gameSpeed);
        }

        function togglePause() {
            isPaused = !isPaused;
            if (isPaused) {
                pauseButton.innerText = "TIẾP TỤC";
                pauseButton.style.background = "linear-gradient(135deg, #00f2fe 0%, #4facfe 100%)";
                
                ctx.fillStyle = "rgba(9, 9, 14, 0.75)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = "#00f2fe";
                ctx.font = "bold 24px 'Segoe UI', Arial";
                ctx.textAlign = "center";
                ctx.fillText("PAUSED", canvas.width / 2, canvas.height / 2);
            } else {
                pauseButton.innerText = "TẠM DỪNG";
                pauseButton.style.background = "linear-gradient(135deg, #ff007f 0%, #ff0055 100%)";
            }
        }

        function changeDirection(direction) {
            if (isPaused) return; 
            if (direction === "LEFT" && dx === 0) { dx = -1; dy = 0; }
            if (direction === "UP" && dy === 0) { dx = 0; dy = -1; }
            if (direction === "RIGHT" && dx === 0) { dx = 1; dy = 0; }
            if (direction === "DOWN" && dy === 0) { dx = 0; dy = 1; }
        }

        document.addEventListener("keydown", event => {
            if (event.key === "ArrowLeft" || event.key === "a") changeDirection("LEFT");
            if (event.key === "ArrowUp" || event.key === "w") changeDirection("UP");
            if (event.key === "ArrowRight" || event.key === "d") changeDirection("RIGHT");
            if (event.key === "ArrowDown" || event.key === "s") changeDirection("DOWN");
            if (event.key === " ") {
                event.preventDefault();
                togglePause();
            }
        });

        document.getElementById("btn-up").addEventListener("click", () => changeDirection("UP"));
        document.getElementById("btn-down").addEventListener("click", () => changeDirection("DOWN"));
        document.getElementById("btn-left").addEventListener("click", () => changeDirection("LEFT"));
        document.getElementById("btn-right").addEventListener("click", () => changeDirection("RIGHT"));
        
        pauseButton.addEventListener("click", togglePause);
        
        document.querySelectorAll('.btn').forEach(button => {
            button.addEventListener('touchstart', (e) => {
                e.preventDefault();
                button.click();
            }, { passive: false });
        });
    </script>
</body>
</html>
